
<!DOCTYPE html>
<html>
<head>
<title>Book Cover Design</title>
<style>
body {
    background-color: #e8d8c3;
    font-family: Arial;
    text-align: center;
}

.cover {
    width: 350px;
    margin: 50px auto;
    padding: 25px;
    background: #563b2e;
    color: white;
    border: 5px solid goldenrod;
    border-radius: 10px;
}

h1 {
    color: gold;
}

img {
    width: 180px;
    height: 200px;
}

p {
    line-height: 1.6;
}
</style>
</head>

<body>
<div class="cover">
    <h1>THE POWER OF DREAMS</h1>
    <img src="book.jpg" alt="Book Image">
    <h3>Discover Your Future</h3>
    <p>
        Every great achievement begins
        with a dream. Believe in yourself
        and work hard to achieve success.
    </p>
    <h4>Written by Irfan</h4>
</div>
</body>
</html>
